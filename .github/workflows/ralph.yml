name: Ralph

# Thin caller — the engine is ralph-run-reusable.yml (org-shared; other repos
# call it as hirobius/ralph/.github/workflows/ralph-run-reusable.yml@v1).
#
# Triggers: manual dispatch (optionally naming an issue — a human override
# that steals any claim), `issues: labeled` (fires when something is tagged
# ralph-ready; the guard filters every other label — load-bearing, see the
# reusable), push-to-main (the chain: an approved+merged Ralph PR pushes
# main, which grabs the next issue), and a 6-hourly schedule (the idle
# watchdog: the event-driven chain halts silently after a failed iteration,
# and label runs queued behind an in-flight run are cancelled by the
# concurrency dedup — the tick re-enters the guard and restarts the queue;
# an idle tick with nothing to do is a quiet no-op). Selection, claiming,
# single-flight, wedge alerts, and reconciliation all live in the reusable
# workflow + ralph/lib.sh — one logic for CI and local runs.
#
# site-engine is the production site factory — never break live client output, no destructive
# ops, merges are human-approved (`ralph-approved` on the PR, or the issue
# pre-tagged `ralph-auto`). Auth: CLAUDE_CODE_OAUTH_TOKEN (Max) — NO API key.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work (blank = deterministic pick via ralph/next.sh)"
        required: false
        type: string
  issues:
    types: [labeled]
  push:
    branches: [main] # chain: a merged Ralph PR grabs the next ralph-ready issue
  schedule:
    # Idle-watchdog BACKSTOP, every 6h (staggered minute 23). The hourly
    # version was disabled 2026-07-16 in favour of a local runner (ops#214)
    # that was deferred and never built, so this repo ran on `push`/`issues`
    # events alone and a failed iteration halted the chain silently — the loop
    # fired on 2026-07-31 and then not again until 2026-09-16 (#192).
    # 6h rather than hourly keeps Actions minutes and Claude usage negligible:
    # most ticks no-op via the single-flight guard. Mirrors the backstop ops
    # adopted in ops#232 (minute 11) and hds in hds#201 (minute 41).
    - cron: "23 */6 * * *"

concurrency:
  group: ralph-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ralph:
    uses: hirobius/ralph/.github/workflows/ralph-run-reusable.yml@v1
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write # chain hop: push runs re-dispatch as workflow_dispatch
    with:
      issue: ${{ inputs.issue || '' }}
    secrets: inherit
